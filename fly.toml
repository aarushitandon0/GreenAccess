# GreenAccess on Fly.io: the API and the built UI, one app, one origin.
#
# Rename `app` before the first deploy; Fly app names are globally unique.
# The full runbook, including the volume and the demo apps, is in
# docs/DEPLOYMENT.md.

app = "greenaccess"
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[env]
  # Same origin, so this is mostly for the CORS allow-list and for any absolute
  # URL the API hands back. Must match the hostname this app is served on.
  PUBLIC_BASE_URL = "https://greenaccess.fly.dev"

  # Where the "Try the Daily Herald demo" button points. This is the second
  # Fly app, deployed from demo-site/. See docs/DEPLOYMENT.md.
  DEMO_URL = "https://greenaccess-demo.fly.dev"

  # The patch re-scan visits the patched copy as if it were any other site, so
  # this has to be the address it is publicly reachable at, not localhost.
  PATCHED_BASE_URL = "https://greenaccess.fly.dev/patched"

  # Deliberately offline. A public deployment with a live key lets any visitor
  # spend money on Anthropic calls. Turn it on only with both of:
  #   fly secrets set ANTHROPIC_API_KEY=sk-...
  #   fly secrets set LLM_OFFLINE=0
  LLM_OFFLINE = "1"

  # MASTERSPEC §17. Stated rather than left to defaults, so the deployed
  # budgets are visible in the same place as everything else.
  MAX_CONCURRENT_SCANS = "2"
  SCAN_TIMEOUT_S = "90"
  NAV_TIMEOUT_S = "30"
  MAX_PAGE_BYTES = "26214400"

  # ALLOWED_LOCAL_HOSTS is deliberately unset. Every host this deployment
  # talks to is public, and the SSRF guard must keep refusing private
  # addresses (CLAUDE.md: dev hosts are allowed only by explicit list, never
  # by weakening the guard).

[http_service]
  internal_port = 8000
  force_https = true
  # A scan is a long request and its SSE stream is longer. Stopping the
  # machine underneath one would drop it, so keep one always running.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    # Generous because an SSE stream occupies a connection for the whole scan;
    # actual scan concurrency is capped in-process by MAX_CONCURRENT_SCANS.
    soft_limit = 50
    hard_limit = 100

# Screenshots, patched copies, zips and the SQLite database. Without this the
# history is wiped on every deploy and a patched URL stops resolving.
# Create it once:  fly volumes create greenaccess_data --region sin --size 3
[mounts]
  source = "greenaccess_data"
  destination = "/app/data"

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  # Chromium rendering a heavy page needs real headroom. 1 GB is where the
  # scanner starts failing on image-heavy sites; 512 MB will not boot it.
  memory = "2gb"
  cpus = 1
