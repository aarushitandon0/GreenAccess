[project]
name = "greenaccess-backend"
version = "0.1.0"
description = "GreenAccess — joint accessibility and carbon audit for a single URL."
requires-python = ">=3.12,<3.13"

# Versions are pinned exactly. See CLAUDE.md "Stack (pinned in lockfiles; do not
# upgrade casually)". The Playwright pin MUST stay in lockstep with the Docker
# base image tag in backend/Dockerfile (mcr.microsoft.com/playwright/python).
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "sse-starlette==3.5.0",
    "pydantic==2.13.5",
    "playwright==1.63.0",
    "lxml==6.1.3",
    "pillow==12.3.0",
    "sqlmodel==0.0.47",
    "httpx==0.28.1",
    "tldextract==5.3.2",
    "anthropic==1.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "respx==0.23.1",
    "ruff==0.16.9",
]

[project.scripts]
greenaccess = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade,
# ASYNC async-correctness, T20 flake8-print (CLAUDE.md: "no print (use logging)"),
# BLE blind-except (CLAUDE.md: "no bare except"), ANN missing type hints.
select = ["E", "W", "F", "I", "B", "UP", "ASYNC", "T20", "BLE", "ANN", "C4", "SIM", "RUF"]
ignore = [
    "ANN401",  # Allow typing.Any in a few deliberate spots (CDP event payloads).
    "E501",    # Line length is enforced by the formatter, not the linter.
]

[tool.ruff.lint.per-file-ignores]
# Tests may use asserts, skip return annotations, and print for diagnostics.
"**/tests/**" = ["ANN", "T20"]
# The CLI is the one place in the app allowed to write to stdout.
"app/cli.py" = ["T20"]
# Developer scripts and the demo server are command-line tools: printing is
# their output, and their argparse entry points are not app code.
"**/scripts/*.py" = ["T20"]
"**/demo-site/server.py" = ["T20"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `app` is imported from the source tree rather than an installed package: this
# host's Application Control policy blocks uv/pip's isolated build step.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = [
    "integration: tests that need the demo site running on :8081/:8082",
    "browser: tests that launch a real Playwright browser",
]
